name: E2E

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-22.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eternova_testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, redis, intl, zip, bcmath, gd, exif
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.testing .env
          php artisan key:generate

      - name: Run migrations and seeders
        run: php artisan migrate:fresh --seed --env=testing

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Laravel dev server
        run: php artisan serve --host=0.0.0.0 --port=8080 &

      - name: Start Vite dev server
        run: npm run dev -- --host 0.0.0.0 --port 5174 &

      - name: Wait for Laravel to be ready
        run: |
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8080 > /dev/null 2>&1; do sleep 2; done'

      - name: Wait for Vite to be ready
        run: |
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:5174 > /dev/null 2>&1; do sleep 2; done'

      - name: Run Playwright tests
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e-report/
          retention-days: 7

      - name: Upload screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            tests/e2e-screenshots/
            tests/e2e-videos/
          retention-days: 7
