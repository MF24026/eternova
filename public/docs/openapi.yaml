      operationId: updateAnExistingCategory
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: validation.max.
                  example: b
                slug:
                  type: string
                  description: '@var Category|null $category validation.max.'
                  example: 'n'
                  nullable: true
                description:
                  type: string
                  description: validation.max.
                  example: 'Animi quos velit et fugiat.'
                  nullable: true
                image_url:
                  type: string
                  description: 'Must be a valid URL. validation.max.'
                  example: 'http://www.dach.com/mollitia-modi-deserunt-aut-ab-provident-perspiciatis-quo.html'
                  nullable: true
                parent_id:
                  type: integer
                  description: 'The <code>id</code> of an existing record in the categories table.'
                  example: 16
                  nullable: true
                sort_order:
                  type: integer
                  description: validation.min.
                  example: 39
                  nullable: true
                is_active:
                  type: boolean
                  description: ''
                  example: true
                  nullable: true
      security: []
    delete:
      summary: 'Soft-delete a category. Children are orphaned (parent_id → null).'
      operationId: softDeleteACategoryChildrenAreOrphanedparentIdNull
      description: ''
      parameters: []
      responses: {  }
      tags:
