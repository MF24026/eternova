openapi: 3.0.3
info:
  title: 'Eternova API v1'
  description: 'REST API for Eternova multi-tenant SaaS.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8080'
tags:
  -
    name: Endpoints
    description: ''
paths:
  /api/v1/health:
    get:
      summary: ''
      operationId: getApiV1Health
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    status: ok
                    version: v1
                  meta:
                    request_id: b2d60fca-3a1a-458c-baa5-e2bae4868e48
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      version:
                        type: string
                        example: v1
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: b2d60fca-3a1a-458c-baa5-e2bae4868e48
      tags:
        - Endpoints
      security: []
  /api/v1/auth/register:
    post:
      summary: 'Register a new global user account.'
      operationId: registerANewGlobalUserAccount
      description: "Creates the user, fires the Registered event (triggers email verification),\nand immediately issues a Bearer token so the SPA can proceed to onboarding\nwithout a second auth round-trip.\n\nNote: this endpoint does NOT create a tenant. Tenant creation happens via\nPOST /api/v1/tenants (issue #13 wizard flow). A fresh user has zero tenants."
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: validation.max.
                  example: b
                email:
                  type: string
                  description: 'validation.email validation.max.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - name
                - email
                - password
      security: []
  /api/v1/auth/login:
    post:
      summary: 'Login via session cookie (SPA mode).'
      operationId: loginViaSessionCookieSPAMode
      description: "After a successful login the SPA's Axios with withCredentials: true\nautomatically sends the session cookie on subsequent requests. The\nresponse body contains the user resource so the SPA can hydrate its store."
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: validation.email.
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                device_name:
                  type: string
                  description: validation.max.
                  example: v
              required:
                - email
                - password
      security: []
  /api/v1/auth/token:
    post:
      summary: 'Issue a Bearer token (mobile / external client mode).'
      operationId: issueABearerTokenmobileExternalClientMode
      description: "The plaintext token is returned once and only once in `plain_text_token`.\nThe token model itself (without the plaintext) is also returned in `data`\nso the client can store the token ID for later revocation."
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: validation.email.
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                name:
                  type: string
                  description: validation.max.
                  example: v
                abilities:
                  type: array
                  description: ''
                  example:
                    - architecto
                  items:
                    type: string
              required:
                - email
                - password
                - name
      security: []
  /api/v1/auth/forgot-password:
    post:
      summary: 'Send a password reset link to the given email.'
      operationId: sendAPasswordResetLinkToTheGivenEmail
      description: "The response is intentionally identical whether or not the email exists,\nto avoid leaking which addresses have accounts (user enumeration). The one\nexception is throttling, which returns 429 so the user knows to wait."
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'validation.email validation.max.'
                  example: gbailey@example.net
              required:
                - email
      security: []
  /api/v1/auth/reset-password:
    post:
      summary: 'Consume a reset token and set the new password.'
      operationId: consumeAResetTokenAndSetTheNewPassword
      description: "On success the remember token is rotated (invalidating other sessions) and\na PasswordReset event fires. An invalid/expired token yields a 422 keyed on\nthe email field so the SPA can surface it inline."
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: ''
                  example: architecto
                email:
                  type: string
                  description: 'validation.email validation.max.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - token
                - email
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Log out the current user.'
      operationId: logOutTheCurrentUser
      description: "Handles both SPA (session) and Bearer token authentication:\n  - Revokes the current access token if the user authenticated via token.\n  - Invalidates the session and regenerates the CSRF token for SPA mode.\n\nReturns 204 No Content — the client should clear its local auth state."
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      security: []
  /api/v1/me:
    get:
      summary: 'Return the currently authenticated user with their tenant memberships.'
      operationId: returnTheCurrentlyAuthenticatedUserWithTheirTenantMemberships
      description: "The /me route is intentionally NOT behind the 'tenant' middleware: it is\nalso called from non-tenant origins (super-admin panel, public storefront\nboot), where EnsureTenant would abort(404). So we resolve the \"current\"\ntenant SOFTLY here — from the request subdomain, only when it matches one\nof the user's memberships — and bind it so UserResource can flag\nis_current and expose the plan. On non-tenant hosts this resolves to null\nand the response simply has no current tenant / plan."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                  error_code: auth.unauthenticated
                  meta:
                    request_id: ''
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
                  error_code:
                    type: string
                    example: auth.unauthenticated
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: ''
      tags:
        - Endpoints
      security: []
  /api/v1/auth/tokens:
    get:
      summary: 'List all personal access tokens for the authenticated user.'
      operationId: listAllPersonalAccessTokensForTheAuthenticatedUser
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                  error_code: auth.unauthenticated
                  meta:
                    request_id: ''
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
                  error_code:
                    type: string
                    example: auth.unauthenticated
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: ''
      tags:
        - Endpoints
      security: []
  '/api/v1/auth/tokens/{tokenId}':
    delete:
      summary: 'Revoke a specific personal access token.'
      operationId: revokeASpecificPersonalAccessToken
      description: "Returns 404 (not 403) when the token does not belong to this user\nto avoid revealing which token IDs exist globally."
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      security: []
    parameters:
      -
        in: path
        name: tokenId
        description: ''
        example: '564'
        required: true
        schema:
          type: string
  /api/v1/billing/webhooks/wompi:
    post:
      summary: ''
      operationId: postApiV1BillingWebhooksWompi
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      security: []
    get:
      summary: ''
      operationId: getApiV1BillingWebhooksWompi
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: ok
                properties:
                  status:
                    type: string
                    example: ok
      tags:
        - Endpoints
      security: []
  /api/v1/account/billing:
    get:
      summary: ''
      operationId: getApiV1AccountBilling
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                  error_code: auth.unauthenticated
                  meta:
                    request_id: ''
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
                  error_code:
                    type: string
                    example: auth.unauthenticated
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: ''
      tags:
        - Endpoints
      security: []
  /api/v1/account/billing/invoices:
    get:
      summary: ''
      operationId: getApiV1AccountBillingInvoices
      description: ''
      parameters: []
      responses:
        401:
          description: ''
