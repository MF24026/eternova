            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                  error_code: auth.unauthenticated
                  meta:
                    request_id: ''
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
                  error_code:
                    type: string
                    example: auth.unauthenticated
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: ''
