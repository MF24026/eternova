      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  description: validation.min.
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: 'The <code>id</code> of an existing record in the categories table.'
                        example: 16
                      sort_order:
                        type: integer
                        description: validation.min.
                        example: 39
                      parent_id:
                        type: integer
                        description: 'The <code>id</code> of an existing record in the categories table.'
                        example: 16
                        nullable: true
                    required:
                      - id
                      - sort_order
              required:
                - items
      security: []
  /api/v1/categories:
    get:
      summary: 'Paginated list of categories.'
      operationId: paginatedListOfCategories
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                  error_code: auth.unauthenticated
                  meta:
                    request_id: ''
                properties:
