                is_active:
                  type: boolean
                  description: ''
                  example: true
                  nullable: true
                is_featured:
                  type: boolean
                  description: ''
                  example: false
                  nullable: true
                tax_rate:
                  type: number
                  description: 'validation.min validation.max.'
                  example: 1
                  nullable: true
                options:
                  type: array
                  description: ''
                  example: null
                  items:
                    type: object
                    nullable: true
                    properties:
                      name:
                        type: string
                        description: 'This field is required when <code>options</code> is present. validation.max.'
                        example: 'n'
                      values:
                        type: array
                        description: validation.max.
                        example:
                          - g
                        items:
                          type: string
                variants:
                  type: array
                  description: ''
                  example: null
                  items:
                    type: object
                    nullable: true
                    properties:
                      sku:
                        type: string
                        description: validation.max.
                        example: z
                        nullable: true
                      price_cents:
                        type: integer
                        description: validation.min.
                        example: 77
                        nullable: true
                      options:
                        type: object
                        description: ''
                        example: null
                        properties: {  }
                        nullable: true
                      barcode:
                        type: string
                        description: validation.max.
                        example: i
                        nullable: true
                      image_url:
                        type: string
                        description: 'Must be a valid URL. validation.max.'
                        example: 'http://www.okon.com/accusantium-harum-mollitia-modi-deserunt-aut-ab'
                        nullable: true
                      position:
                        type: integer
                        description: validation.min.
                        example: 50
                        nullable: true
                categories:
                  type: array
                  description: 'The <code>id</code> of an existing record in the categories table.'
                  example:
                    - 16
                  items:
                    type: integer
                tags:
                  type: array
                  description: 'The <code>id</code> of an existing record in the tags table.'
                  example:
                    - 16
                  items:
                    type: integer
              required:
                - name
                - base_price_cents
      security: []
  '/api/v1/products/{id}':
    get:
      summary: 'Single product with all relations.'
      operationId: singleProductWithAllRelations
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
